schema_version = "1.0.0"

# 插件的唯一标识符，需与 __init__.py 中的模块名或 __package__ 对应
id = "dds_save"
# 版本号，遵循主.次.补丁格式
version = "1.0.0"
# 插件显示名称
name = "DDS Save"
# 一句话简介（官方限制：最多 64 个字符）
tagline = "Save images as DDS via texconv, plus native formats"
# 维护者信息
maintainer = "AI Assistant <your.email@example.com>"
# 类型，插件固定为 "add-on"
type = "add-on"

# 可选：标签，需从官方支持的标签列表中选择
tags = ["Import-Export", "Material", "Pipeline"]

# 支持的最低 Blender 版本
blender_version_min = "4.2.0"

# 许可证，使用 SPDX 标识符
license = [ "SPDX:GPL-3.0-or-later" ]

# 插件需要访问文件系统（读写 DDS、PNG 等文件）
[permissions]
files = "Import/export DDS and texture files from/to disk"